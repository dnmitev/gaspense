name: CI

# The `push` trigger is the one that matters: this project commits directly to
# `main` and does not open a PR per change, so a pull_request-only workflow
# would never fire. The pull_request trigger covers the occasional PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. The default GITHUB_TOKEN carries write scopes this job does
# not need, and this is a public repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref rather than queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway service-container credentials. These are deliberately NOT GitHub
    # secrets: the database exists only for the duration of this job and holds
    # nothing but test fixtures. Treating them as secrets would imply they matter.
    env:
      DATABASE_URL: "postgresql://gaspense:gaspense_ci@localhost:5432/gaspense_test?schema=public"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gaspense
          POSTGRES_PASSWORD: gaspense_ci
          POSTGRES_DB: gaspense_test
        ports:
          - 5432:5432
        # Without a health check, steps can start before Postgres accepts
        # connections and fail intermittently.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pinned to the floor declared in package.json `engines`, so CI tests
          # the oldest supported runtime rather than only the newest.
          #
          # 22, not 20: Node 20 reached end-of-life on 2026-04-30, so testing
          # against it would validate an unsupported runtime. 22 is LTS until
          # 2027-04-30.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs scripts/check-docs.sh, prettier --check, eslint, and markdownlint.
      - name: Run check gate
        run: npm run check

      # Compiles the Next.js app and type-checks it.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Applies committed migrations to the service-container database. Uses
      # `migrate deploy`, never `migrate dev` — deploy is the non-interactive,
      # production-shaped command and will not try to generate new migrations.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

      # CI runners have no browsers preinstalled — omitting this is the usual
      # first failure when adding Playwright to a pipeline.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `npm run build && npm start`, so this step
      # rebuilds. The duplication with the Build step above is accepted for now
      # rather than restructuring the workflow verified in plan 01-01.
      - name: E2E tests
        run: npm run test:e2e
