<!doctype html>
<!--
  Served by the service worker when a navigation fails.

  Deliberately static and self-contained: no JavaScript, no network request, no
  user data. It is precached at install time, so it has to be renderable with
  nothing else available — and it must never imply anything about the signed-in
  account, because the worker cannot know whether there still is one.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Gaspense</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #ffffff;
        color: #171717;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 28rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #525252;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
        p {
          color: #a3a3a3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Gaspense needs a connection to show your cars and expenses. Nothing you have already
        recorded is affected.
      </p>
      <p>Reconnect and reload this page to carry on.</p>
    </main>
  </body>
</html>
